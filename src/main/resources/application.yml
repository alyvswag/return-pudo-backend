spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ReturnPUDO
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:migrations/changelog-master.xml
    enabled: true
